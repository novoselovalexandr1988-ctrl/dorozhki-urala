{{ define "main" }}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-md-9">
      <h1>{{ .Title }}</h1>
      <p class="lead">{{ .Params.description }}</p>
      <div class="content">
        {{ .Content }}
      </div>
      <div class="row">
        {{ range .Pages }}
          <div class="col-12 col-md-6 mb-4">
            <div class="service service-summary">
              <div class="service-content">
                <p class="service-title">Категория</p>
                <h2 class="service-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
                <p>{{ .Params.description }}</p>
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                  <a class="button button-primary" href="{{ .RelPermalink }}">Смотреть компании</a>
                  <a class="button button-white" href="/reviews/">Оставить отзыв</a>
                </div>
              </div>
            </div>
          </div>
        {{ end }}
      </div>
    </div>
  </div>
</div>
{{ end }}
